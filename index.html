<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Emergency Department Visits (2016–2022) — Interactive Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header>
    <h1>Emergency Department Visits in the US</h1>
    <p class="subtitle">Interactive analysis dashboard · 2016–2022 estimates</p>
  </header>

  <main>
    <section class="controls">
      <label>Year
        <select id="yearFilter"></select>
      </label>
      <label>Group
        <select id="groupFilter"></select>
      </label>
      <label>Subgroup
        <select id="subgroupFilter"></select>
      </label>
      <div class="chart-toggle" role="group" aria-label="Chart type">
        <button data-chart="bar" class="active">Bar</button>
        <button data-chart="line">Line</button>
        <button data-chart="pie">Pie</button>
      </div>
    </section>

    <section class="chart-card">
      <div id="chart"></div>
    </section>

    <section class="table-card">
      <div class="table-head">
        <h2>Data</h2>
        <input id="searchBox" type="search" placeholder="Search table…" aria-label="Search table">
        <button id="exportBtn">Export CSV</button>
      </div>
      <p id="rowCount" class="row-count"></p>
      <div class="table-wrap">
        <table id="dataTable"></table>
      </div>
      <p class="hint">Click a column header to sort.</p>
    </section>

    <p class="footnote">Sample dataset is synthetic and included for demo purposes. Values shown in thousands of visits.</p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
